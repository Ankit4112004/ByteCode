# Keep-alive: pings the deployed API's /health from GitHub's free runners so a
# free host (Render) never spins down — and, unlike the in-app self-ping, this
# runs OUTSIDE Render, so it can also WAKE the service if it ever did sleep.
#
# This is NOT a build/deploy pipeline — just a scheduled health ping.
#
# Setup (one time): Repo → Settings → Secrets and variables → Actions →
#   Variables tab → New variable:  name = API_HEALTH_URL
#   value = https://<your-api>.onrender.com/health
name: keep-alive

on:
  schedule:
    # GitHub cron is UTC and has no timezone. Active window is 08:30–21:30 IST,
    # which is 03:00–16:00 UTC. Every 10 min inside that window only:
    - cron: "*/10 3-15 * * *" # 03:00–15:50 UTC = 08:30–21:20 IST
    - cron: "0 16 * * *"      # 16:00 UTC = 21:30 IST
  workflow_dispatch: {}            # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="${{ vars.API_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "API_HEALTH_URL variable is not set — skipping (see workflow comments)."
            exit 0
          fi
          # Retry a few times: a cold start can take ~50s, so the first hit may
          # need to wait for the service to wake before it answers.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo 000)
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Health check did not return 200 after retries (service may be waking)."
